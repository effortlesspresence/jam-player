# JAM Player 2.0 - systemd journald configuration
#
# Installed to /etc/systemd/journald.conf.d/jam.conf by jam-update.service.
# Takes effect when systemd-journald restarts (the nightly reboot does it).
#
# THE PRIORITY HERE IS SD-CARD WEAR. JAM Players run from SD cards, and a
# persistent journal that absorbs every INFO line from every service writes
# to that card all day, every day. Fielded cards have died of exactly this.
#
# So the on-device journal keeps ONLY what is needed to tell that a critical
# part of the system is not working: WARNING and above, from every unit.
# Everything below that level is never written to disk by journald at all
# (MaxLevelStore drops it before storage). The JAM services' INFO/DEBUG
# output goes to the backend instead, where it is searchable per player and
# per service in the dashboards; if the player is offline those lines are
# dropped, which is the accepted trade. See docs/LOGGING.md.
#
# History: this file originally capped the journal at 1 GB because
# uncapped journals (upstream default ~10% of the card) blocked the
# 1.0 -> 2.0 migration by crowding out its temporary disk headroom.

[Journal]
# Keep WARNING+ on disk across reboots so an operator on site can still see
# what failed before the 3 AM reboot cycle.
Storage=persistent

# Never persist anything below WARNING, from ANY unit. This single line
# removes the bulk of the writes: INFO/DEBUG chatter from our services,
# NetworkManager, wpa_supplicant, bluez and the kernel all stop hitting the
# card. (Priority numbers: emerg=0 ... warning=4, notice=5, info=6, debug=7.)
#
# Why not NOTICE: it was considered and rejected. Going one level down buys
# almost nothing we need -- systemd's "Started"/"Finished" lines are INFO
# and would stay dropped anyway, and the only routine NOTICE line is the
# exit-code detail on a service failure, which our own services now record
# as a CRITICAL traceback through the logger. What NOTICE would add is
# kernel and daemon chatter on every boot, i.e. more writes for no more
# signal. Failures themselves ("Failed with result", "Failed to start",
# signal deaths) are WARNING or higher and are kept.
MaxLevelStore=warning

# If rsyslog is ever present on an image, journald would still forward every
# INFO line to it (the forward path is gated by MaxLevelSyslog, not
# MaxLevelStore) and /var/log/syslog would silently reinstate the writes
# this file removes. Forwarding is off regardless.
ForwardToSyslog=no

# Hard cap for the persistent journal directory (/var/log/journal/...).
# NOTICE+ only is still small next to the old 1 GB, and 256 MB buys months
# of history on a 16 GB card -- worth it for after-the-fact forensics on a
# device we cannot log into while it is offline.
SystemMaxUse=256M

# Journald will aggressively vacuum old entries if free disk falls below
# this threshold, even if SystemMaxUse hasn't been hit yet. Protects
# updates and content downloads from ever being blocked by log volume.
SystemKeepFree=500M

# Individual journal file size before rotation. Kept well under
# SystemMaxUse so the budget spans several files and vacuuming (which drops
# whole files) frees space in reasonable steps rather than all at once.
SystemMaxFileSize=32M

# Purge entries older than this regardless of size.
MaxRetentionSec=14day

# Rate limit per-service output: at most 5000 messages per 30s window
# before journald starts dropping messages from that service. A backstop
# against a runaway logger; our services should never come near it.
RateLimitIntervalSec=30s
RateLimitBurst=5000
