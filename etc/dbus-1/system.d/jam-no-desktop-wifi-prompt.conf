<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    Nothing in the desktop session may answer NetworkManager's requests for a
    Wi-Fi password, so nothing can put a password prompt on the customer's TV.

    WHAT THIS STOPS. When a saved Wi-Fi profile fails to authenticate,
    NetworkManager asks every registered "secret agent" for a new password.
    The Pi OS desktop that the JAM display runs inside starts a network
    applet, and that applet registers as one. So a profile with a password
    that no longer works (the customer changed it at the router, or a wrong
    one was left behind by the fielded 7440d2d code) made the applet draw
    "Authentication required by Wi-Fi network" on top of the content, with
    nobody there to dismiss it.

    HOW. An agent registers by calling the AgentManager interface below. Only
    root may do that now. With no agent to ask, NetworkManager fails the
    attempt quietly and carries on with its normal retries. The JAM services
    are not affected: they run as root, and they give NetworkManager the
    password in the profile itself.

    The rule is deliberately narrow: ONE interface. Do not add a rule here
    that denies org.freedesktop.NetworkManager as a whole.

    Installed by jam_update.install_desktop_wifi_prompt_block(). An applet
    that registered before this file arrived stays registered until the next
    boot.
  -->
  <policy context="default">
    <deny send_destination="org.freedesktop.NetworkManager"
          send_interface="org.freedesktop.NetworkManager.AgentManager"/>
  </policy>

  <!-- The desktop session's user, named so a group rule cannot re-allow it. -->
  <policy user="comitup">
    <deny send_destination="org.freedesktop.NetworkManager"
          send_interface="org.freedesktop.NetworkManager.AgentManager"/>
  </policy>

  <policy user="root">
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager.AgentManager"/>
  </policy>
</busconfig>
