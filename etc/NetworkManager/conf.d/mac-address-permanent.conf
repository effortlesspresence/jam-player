# JAM Player MAC Address Stability Configuration
#
# Force BOTH interfaces to associate using their PERMANENT (burned-in)
# hardware MAC, never a randomized or "stable"-hashed address.
#
# WHY THIS IS LOAD-BEARING:
# Customer networks authorize these players BY MAC ADDRESS -- university and
# enterprise NAC (MAC Authentication Bypass), captive-portal allowlists, and
# DHCP reservations all key on it. If NetworkManager ever presented a
# randomized MAC, every registered player would silently drop off the
# customer's network at once, and recovery would mean re-collecting MACs and
# asking their IT to re-register every device by hand.
#
# Ethernet is included deliberately: MAB and DHCP reservations are just as
# common on wired ports as wireless, and most JAM Player installs are wired.
#
# This is PREVENTATIVE, not a fix for present-day behavior. NetworkManager's
# current default is `preserve`, and fielded devices were verified using their
# hardware MAC (2026-08-05). This pins that behavior so a future
# NetworkManager or Raspberry Pi OS default cannot change it out from under a
# fleet that customers have already allowlisted.
#
# `permanent` is deliberately stronger than `preserve`: preserve keeps
# whatever MAC the interface happened to carry when NM took it over, while
# permanent always uses the hardware address.
#
# NOTE: scan-time randomization (probe requests while scanning) is disabled
# separately in wifi-stability.conf via [device] wifi.scan-rand-mac-address.
# The settings here cover the association itself, which is what customer NAC
# and DHCP actually see.

[connection]
wifi.cloned-mac-address = permanent
ethernet.cloned-mac-address = permanent
