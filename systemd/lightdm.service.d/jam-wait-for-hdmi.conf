# JAM Player drop-in for lightdm.service
#
# Gates lightdm on jam-display-wait-for-hdmi.service so the X server /
# Wayfire session doesn't start against the kernel's 1920x1080 virtual
# fallback when no HDMI is attached at boot. Once HDMI is connected,
# Wayfire negotiates the TV's native resolution (4K when supported) and
# renders content at the correct resolution.
#
# `Wants=` (not `Requires=`) is critical: if the wait service crashes,
# times out, or has any kind of bug, lightdm still starts. Worst case we
# fall back to today's behavior (4-quadrant artifact on 4K TVs that were
# plugged in after power). Hotplug monitor recovers by restarting lightdm
# on next HDMI reconnect.

[Unit]
After=jam-display-wait-for-hdmi.service
Wants=jam-display-wait-for-hdmi.service
