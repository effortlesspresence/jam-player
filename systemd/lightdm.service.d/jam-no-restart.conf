# JAM Player drop-in for lightdm.service
#
# Disables systemd's automatic restart of lightdm when it exits with
# failure.
#
# Why: lightdm on Bookworm + Pi 4/5 has a latent crash in its GObject
# signal teardown path (g_signal_emit_valist NULL class pointer assertion)
# that fires deterministically when the autologin session opens, then
# closes, then the greeter is launched. With the stock Restart=always,
# systemd restarts lightdm every ~3 seconds; the same crash fires every
# time, and the X session gets torn down and reinitialized on every
# cycle. mpv (which holds the DRM/KMS handle directly) sees the X server
# disappearing and reappearing, which manifests as the customer-visible
# "screen flashes between content and black every second" symptom.
#
# Setting Restart=no lets lightdm crash exactly once. The X session that
# came up during that single successful start phase survives the crash
# (mpv keeps rendering against the DRM surface independently of lightdm).
# The result is a stable display, even though lightdm itself is "failed"
# permanently until reboot.
#
# This is a workaround, not a root-cause fix. The actual lightdm/greeter
# bug needs to be addressed upstream (or by swapping greeters, or by
# bypassing lightdm entirely). But this drop-in eliminates the
# customer-visible symptom while we investigate.
#
# If lightdm DOES start cleanly (which it can on some hardware + boot
# conditions), this drop-in has no effect -- lightdm just stays running.

[Service]
Restart=no
